# File description: Forgejo release of Lynxx on the Home Server's self-hosted Forgejo, in parallel with the GitHub
# release pipeline (.github/workflows/release.yml) while GitHub stays the source of truth: the v* tag that the GitHub
# release creates reaches Forgejo through the pull mirror, and this workflow builds again and publishes to Forgejo.
# - linux: the desktop app (Electron + the frozen Python core of tools/build_core.py) as .deb and .AppImage for x64, built
#   natively in a Debian container; the packaged app runs its self-test under xvfb. Generic package lynxx/<version>/ with
#   SHA256SUMS-linux and its minisign signature, Debian registry (distribution stable, component main for releases, rc for
#   release candidates), Forgejo Release with the checksums.
# Windows, macOS and Linux arm64 are published on GitHub only: the PyInstaller core is built natively per platform.
# Forgejo settings: org variables BASE_IMAGES, PACKAGES_USER; repository secrets PACKAGES_TOKEN (bootstrap_forgejo.py
# --with-release-bot, RELEASE_REPOSITORIES), MINISIGN_SECRET_KEY
# (scripts/signing_keys.py init --repository Lynxx; the public keys are in keys/ of this repository).
# Runs on the Forgejo runner label "docker" only; GitHub workflows (.github/) never run on Forgejo.
name: forgejo-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the Linux files as a dev package (no Release)
        type: boolean
        default: false

env:
  SERVER_URL: ${{ forgejo.server_url }}
  REPOSITORY: ${{ forgejo.repository }}
  OWNER: ${{ forgejo.repository_owner }}
  REF_NAME: ${{ forgejo.ref_name }}
  REF_TYPE: ${{ forgejo.ref_type }}
  SHA: ${{ forgejo.sha }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux:
    runs-on: docker
    container:
      image: ${{ vars.BASE_IMAGES }}/node:22-bookworm
    timeout-minutes: 90
    steps:
      - name: Plan version
        run: |
          set -eu
          if [ "${REF_TYPE}" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-forgejo.$(printf '%s' "${SHA}" | cut -c1-7)"
          fi
          echo "APP_VERSION=${version}" >> "${FORGEJO_ENV:-$GITHUB_ENV}"
          echo "Lynxx ${version}"

      # Plain git with a credential file written by the printf builtin, so the token never reaches a process list.
      - name: Checkout
        env:
          TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          host="${SERVER_URL#*://}"; host="${host%%/*}"
          ( umask 077 && printf 'https://x-access-token:%s@%s\n' "${TOKEN}" "${host}" > "${HOME}/.git-credentials" )
          git config --global credential.helper store
          git init -q . && git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch -q --depth 1 origin "${SHA}" && git checkout -q FETCH_HEAD
          : > "${HOME}/.git-credentials"
          app_version="$(node -p "require('./app/package.json').version")"
          case "${APP_VERSION}" in
            "${app_version}" | "${app_version}"-*) ;;
            *) echo "::warning::tag ${REF_NAME} does not match app/package.json ${app_version}" ;;
          esac
          echo "lynxx $(git rev-parse --short HEAD), app/package.json ${app_version}"

      - name: Build tools
        run: |
          set -eu
          apt-get update -qq
          # python for the frozen core; xvfb and the Electron runtime libraries for the self-test; minisign to sign
          apt-get install -y -qq --no-install-recommends python3 python3-venv python3-dev binutils xvfb xauth minisign \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libpango-1.0-0 libcairo2 libxss1 libxshmfence1 >/dev/null
          python3 --version

      - name: Build the frozen core (with its smoke test)
        run: |
          set -eu
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install -q --upgrade pip
          /tmp/venv/bin/python -m pip install -q -r requirements.txt 'pyinstaller>=6.21'
          /tmp/venv/bin/python tools/build_core.py

      - name: Build the app (.deb, .AppImage)
        working-directory: app
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm run check
          npm version "${APP_VERSION}" --no-git-tag-version --allow-same-version
          # fpm and mksquashfs keep the modes they find: installed files must not be writable by others
          umask 0022
          find .. -path ../.git -prune -o -exec chmod go+rX,go-w {} +
          npx --no-install electron-builder --linux AppImage deb --x64 --publish never
          ls -l dist/*.deb dist/*.AppImage

      - name: Check installer file modes
        run: |
          set -eu
          bad="$(for deb in app/dist/*.deb; do dpkg-deb -c "${deb}"; done | awk '{m=$1} substr(m,8,1)!="r" || (substr(m,1,1)=="d" && substr(m,10,1)!="x") || substr(m,6,1)=="w" || substr(m,9,1)=="w" {print}')"
          if [ -n "${bad}" ]; then echo "the .deb has entries with wrong modes"; echo "${bad}" | head -20; exit 1; fi

      # The app's own self-test (quick: no screenshots, no network): frozen core, sidecar contract, pages and theme,
      # import / reader / EPUB export, an extension in the packaged sandbox, the quit guard. Bounded by python, xvfb gives
      # Electron a display.
      - name: Self-test of the packaged app
        env:
          LYNXX_SELFTEST_QUICK: "1"
        run: |
          set -eu
          export LYNXX_SELFTEST_DIR="$(mktemp -d)"
          python3 -c 'import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=600).returncode)' \
            xvfb-run -a app/dist/linux-unpacked/lynxx --no-sandbox
          python3 tools/check_selftest.py "${LYNXX_SELFTEST_DIR}/report.json"

      - name: Checksums
        run: |
          set -eu
          mkdir -p dist
          cp app/dist/lynxx-*.deb app/dist/lynxx-*.AppImage dist/
          (cd dist && sha256sum -- * > SHA256SUMS-linux && cat SHA256SUMS-linux)

      - name: Sign the checksums with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          key="$(mktemp)"
          ( umask 077 && printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key}" )
          # Verify with keys/minisign.pub: minisign -Vm SHA256SUMS-linux -p minisign.pub, then sha256sum -c.
          minisign -S -s "${key}" -m dist/SHA256SUMS-linux -x dist/SHA256SUMS-linux.minisig \
            -t "Lynxx ${REF_NAME} SHA256SUMS-linux (${SHA})"
          rm -f "${key}"

      - name: Publish Debian and generic packages
        if: ${{ forgejo.ref_type == 'tag' || inputs.publish }}
        env:
          PACKAGES_USER: ${{ vars.PACKAGES_USER }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -eu
          if [ -n "${SDP_FORGEJO_CA:-}" ]; then export CURL_CA_BUNDLE="${SDP_FORGEJO_CA}"; fi
          host="${SERVER_URL#*://}"; host="${host%%/*}"
          netrc="$(mktemp)"
          ( umask 077 && printf 'machine %s login %s password %s\n' "${host}" "${PACKAGES_USER}" "${PACKAGES_TOKEN}" > "${netrc}" )
          for file in dist/*; do
            curl -fsS --netrc-file "${netrc}" --upload-file "${file}" \
              "${SERVER_URL}/api/packages/${OWNER}/generic/lynxx/${APP_VERSION}/$(basename "${file}")"
            echo "generic: lynxx/${APP_VERSION}/$(basename "${file}")"
          done
          # Release candidates go to the "rc" component so `apt` users on "main" only get releases.
          component=main; case "${APP_VERSION}" in *-*) component=rc ;; esac
          for deb in dist/*.deb; do
            curl -fsS --netrc-file "${netrc}" --upload-file "${deb}" \
              "${SERVER_URL}/api/packages/${OWNER}/debian/pool/stable/${component}/upload"
            echo "debian: stable/${component} $(basename "${deb}")"
          done
          : > "${netrc}"

      - name: Create the release with the checksums
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          TOKEN: ${{ forgejo.token }}
        run: |
          set -eu
          if [ -n "${SDP_FORGEJO_CA:-}" ]; then export CURL_CA_BUNDLE="${SDP_FORGEJO_CA}"; fi
          api="${SERVER_URL}/api/v1/repos/${REPOSITORY}"
          header="$(mktemp)"
          ( umask 077 && printf 'Authorization: token %s\n' "${TOKEN}" > "${header}" )
          release_id="$(curl -sS -H @"${header}" "${api}/releases/tags/${REF_NAME}" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).id||"")}catch{console.log("")}})')"
          if [ -z "${release_id}" ]; then
            prerelease=false; case "${APP_VERSION}" in *-*) prerelease=true ;; esac
            # The files are in the generic registry; attaching them again would store every file twice.
            body="Linux x64 files built by Forgejo Actions from ${SHA}: the desktop app (.deb, .AppImage). Download them from the generic package ${SERVER_URL}/${OWNER}/-/packages/generic/lynxx/${APP_VERSION} (Debian/Ubuntu: the Forgejo Debian registry, component main for releases, rc for release candidates). Windows, macOS and Linux arm64: GitHub Releases. Verify SHA256SUMS-linux with its .minisig and keys/minisign.pub of the repository (minisign -Vm SHA256SUMS-linux -p minisign.pub), then the files with sha256sum -c."
            release_id="$(curl -fsS -H @"${header}" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${REF_NAME}\",\"name\":\"Lynxx ${APP_VERSION}\",\"prerelease\":${prerelease},\"body\":\"${body}\"}" \
              "${api}/releases" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')"
          fi
          for file in dist/SHA256SUMS-linux dist/SHA256SUMS-linux.minisig; do
            curl -fsS -H @"${header}" -F "attachment=@${file}" "${api}/releases/${release_id}/assets?name=$(basename "${file}")" >/dev/null
            echo "asset: $(basename "${file}")"
          done
          : > "${header}"

      # Forgejo packages belong to the owner; linking shows them on this repository's Packages tab. HTTP 400 means the
      # package is already linked; any failure only warns.
      - name: Link packages to this repository
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -eu
          if [ -n "${SDP_FORGEJO_CA:-}" ]; then export CURL_CA_BUNDLE="${SDP_FORGEJO_CA}"; fi
          header="$(mktemp)"
          ( umask 077 && printf 'Authorization: token %s\n' "${PACKAGES_TOKEN}" > "${header}" )
          repo="${REPOSITORY#*/}"
          for package in generic/lynxx debian/lynxx-desktop; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H @"${header}" \
              "${SERVER_URL}/api/v1/packages/${OWNER}/${package}/-/link/${repo}" || true)"
            case "${code}" in
              2*) echo "linked ${package} to ${repo}" ;;
              400) echo "${package} is already linked" ;;
              *) echo "::warning::linking ${package} returned HTTP ${code}" ;;
            esac
          done
          : > "${header}"

