name: Tests

on:
  push:
    branches:
      - 'develop'
      - 'staging'
      - 'production'
    paths:
      - .github/workflows/**
      - 'lynxx/**'
      - 'extensions/**'
      - 'tools/**'
      - 'app/icon-utils.js'
      - 'app/plugin/**'
      - 'app/test/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '!lynxx/vcs/version.py'
  # every pull request, docs-only ones included: 'Tests passed' is a required check of the branch ruleset, and a
  # workflow skipped by a path filter would leave it pending forever
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt
          pip install 'anthropic>=2.9'  # optional AI extra: its SDK wire test (local server, no key) runs too
      - name: Run tests
        continue-on-error: False
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=140 --statistics
          python -m unittest lynxx/tests/tests.py
          python -m unittest lynxx.tests.test_lynxx lynxx.tests.test_gender lynxx.tests.test_security lynxx.tests.test_batch_b lynxx.tests.test_batch_c lynxx.tests.test_batch_c_tags lynxx.tests.test_batch_d_core lynxx.tests.test_batch_d_search lynxx.tests.test_batch_d_app lynxx.tests.test_extgen lynxx.tests.test_dlindex lynxx.tests.test_dlindex_tools lynxx.tests.test_model_server lynxx.tests.test_media_verify lynxx.tests.test_catalog_trust lynxx.tests.test_aigen_eval lynxx.tests.test_gender_eval lynxx.tests.test_tag_sources lynxx.tests.test_search_kinds lynxx.tests.test_type_tag_list lynxx.tests.test_gelbooru_ext lynxx.tests.test_e621_ext lynxx.tests.test_pick_and_quality lynxx.tests.test_rule34xyz_ext
          node app/test/icon-utils.test.js
      - name: Lynxx library, formats and exports
        run: |
          python -m unittest lynxx.tests.test_foundation lynxx.tests.test_library_import lynxx.tests.test_epub_reader lynxx.tests.test_policy_uncen lynxx.tests.test_source_adapters lynxx.tests.test_nhentai_api lynxx.tests.test_library_books lynxx.tests.test_formats_text lynxx.tests.test_formats_office lynxx.tests.test_formats_ole lynxx.tests.test_formats_legacy
      - name: Extension runtime (vBook format)
        shell: bash
        run: |
          node app/test/plugin-runtime.test.js
          node app/test/book-jobs.test.js
          for f in app/plugin/*.js app/renderer/*.js app/main.js app/preload.js; do node --check "$f"; done

  # the one check the ruleset of develop, staging and production requires: every job of the matrix passed
  passed:
    name: Tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then echo "::error::test jobs: $RESULT"; exit 1; fi
          echo "test jobs: $RESULT"
