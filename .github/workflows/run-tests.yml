name: Tests

on:
  push:
    branches:
      - 'develop'
      - 'staging'
      - 'production'
    paths:
      - .github/workflows/**
      - 'lynxx/**'
      - 'tools/**'
      - 'app/**'
      - '!app/package-lock.json'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '!lynxx/vcs/version.py'
  # every pull request, docs-only ones included: 'Tests passed' is a required check of the branch ruleset, and a
  # workflow skipped by a path filter would leave it pending forever
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt
      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=140 --statistics
      - name: Library, file formats, reader and exports
        run: python -m unittest discover -s lynxx/tests -t . -v
      - name: Extension runtime (vBook format) and app scripts
        shell: bash
        run: |
          node app/test/icon-utils.test.js
          node app/test/plugin-runtime.test.js
          node app/test/book-jobs.test.js
          for f in app/plugin/*.js app/renderer/*.js app/main.js app/preload.js app/icon-utils.js; do node --check "$f"; done

  # the one check the ruleset of develop, staging and production requires: every job of the matrix passed
  passed:
    name: Tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then echo "::error::test jobs: $RESULT"; exit 1; fi
          echo "test jobs: $RESULT"
