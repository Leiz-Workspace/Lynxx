name: Builds

# Manual builds of the desktop app (Electron + the frozen core of tools/build_core.py) on the selected systems, unsigned,
# uploaded as workflow artifacts. Releases are made by release.yml (push to staging / production).
on:
  workflow_dispatch:
    inputs:
      linux:
        default: false
        type: boolean
      macos:
        default: false
        type: boolean
      windows:
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  desktop:
    if: inputs.linux || inputs.macos || inputs.windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        exclude:
          - os: ${{ !inputs.linux && 'ubuntu-latest' || 'none' }}
          - os: ${{ !inputs.macos && 'macos-15' || 'none' }}
          - os: ${{ !inputs.windows && 'windows-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frozen core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.21"
          python tools/build_core.py
      - name: Build app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
          compression-level: 0
          if-no-files-found: error
